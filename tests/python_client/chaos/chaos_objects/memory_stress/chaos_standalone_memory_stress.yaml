kind: StressChaos
apiVersion: chaos-mesh.org/v1alpha1
metadata:
  name: test-standalone-memory-stress
  namespace: chaos-testing
spec:
  selector:
    namespaces:
      - chaos-testing
    labelSelectors:
      app.kubernetes.io/component: standalone
      app.kubernetes.io/instance: milvus-chaos
      app.kubernetes.io/name: milvus
  mode: one
  stressors:
    memory:
      workers: 4
      size: 6Gi
  duration: 5m